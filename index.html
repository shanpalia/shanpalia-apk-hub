<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShanPalia APK Hub</title>

<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
body{ background:#ffffff; color:#111827; }

/* 👑 NAVIGATION HEADER SYSTEM */
header{ background:#ffffff; padding:18px 5%; display:flex; justify-content:space-between; align-items:center; box-shadow:0 2px 12px rgba(0,0,0,.06); position:sticky; top:0; z-index:999; }
.logo{ font-size:30px; font-weight:700; color:#2563eb; text-decoration:none; }
nav { display: flex; align-items: center; gap: 15px; flex-wrap: wrap; }
nav a{ text-decoration:none; color:#334155; font-weight:600; font-size: 15px; }

/* ADMIN BUTTON STYLING */
nav a.admin-btn { color: #ffffff !important; background: #dc2626 !important; padding: 8px 16px; border-radius: 30px; box-shadow: 0 4px 10px rgba(220, 38, 38, 0.2); transition: 0.2s; text-transform: uppercase; font-size: 13px; letter-spacing: 0.5px; }
nav a.admin-btn:hover { background: #b91c1c !important; transform: translateY(-1px); }

.hero{ background:#ffffff; padding:100px 20px; text-align:center; }
.hero h1{ font-size:70px; font-weight:800; color:#2563eb; margin-bottom:20px; }
.hero p{ font-size:22px; color:#64748b; margin-bottom:35px; }
.search-box{ max-width:800px; margin:auto; display:flex; background:#ffffff; border:2px solid #dbeafe; border-radius:60px; overflow:hidden; box-shadow:0 8px 25px rgba(37,99,235,.10); }
.search-box input{ flex:1; padding:18px; border:none; outline:none; font-size:16px; }
.search-box button{ background:#2563eb; color:white; border:none; padding:18px 35px; cursor:pointer; font-weight:bold; }
.section{ padding:70px 5%; }
.title{ text-align:center; font-size:40px; margin-bottom:40px; color:#2563eb; }
.categories{ display:flex; justify-content:center; gap:20px; flex-wrap:wrap; margin:30px 0; }
.category{ background:white; padding:20px; border-radius:20px; text-align:center; border:1px solid #e5e7eb; box-shadow:0 4px 15px rgba(0,0,0,.05); font-size:18px; font-weight:bold; transition:.3s; min-width:180px; cursor: pointer; color:#2563eb; }
.category:hover, .category.active { transform:translateY(-5px); box-shadow:0 8px 25px rgba(37,99,235,.15); background: #eff6ff; border-color: #2563eb; }
.apps{ display:grid; grid-template-columns:repeat(auto-fit,minmax(280px,1fr)); gap:25px; }

/* APP CARD INTERFACES */
.app-card{ background:white; padding:25px; border-radius:20px; border:1px solid #e5e7eb; box-shadow:0 4px 15px rgba(0,0,0,.05); text-align:center; transition: .3s; cursor: pointer; text-decoration: none; color: inherit; display: block; }
.app-card:hover{ transform: translateY(-5px); box-shadow:0 10px 25px rgba(0,0,0,.1); }
.app-card img{ width:90px; height:90px; border-radius:20px; margin-bottom:15px; object-fit: cover; }
.app-card h3{ margin-bottom:10px; font-size:20px; color:#1e293b; }
.meta-info { display: flex; justify-content: center; gap: 15px; font-size: 13px; color: #64748b; margin-top: 10px; font-weight: bold; }
.meta-info .rating { color: #eab308; }
.meta-info .dl { color: #10b981; }
.view-btn { display:inline-block; background:#2563eb; color:white; padding:10px 20px; border-radius:10px; margin-top:15px; font-weight:bold; font-size: 14px; }
.ad-box{ background:#eff6ff; padding:40px; text-align:center; border:2px dashed #2563eb; border-radius:20px; margin-bottom:50px; font-size:22px; font-weight:bold; color:#2563eb; }

/* FEEDBACK STYLING */
.feedback{ max-width:700px; margin:auto; background:white; padding:30px; border-radius:20px; border:1px solid #e5e7eb; box-shadow:0 4px 15px rgba(0,0,0,.05); }
.feedback input, .feedback textarea{ width:100%; padding:14px; margin-top:12px; border:1px solid #cbd5e1; border-radius:10px; outline:none; font-size:15px; }
.feedback button{ width:100%; margin-top:15px; background:#2563eb; color:white; border:none; padding:14px 25px; border-radius:10px; cursor:pointer; font-weight:bold; font-size:16px; }

footer{ background:#f8fafc; padding:40px; text-align:center; border-top:1px solid #e5e7eb; }
</style>
</head>
<body>

<header>
<a href="index.html" class="logo">ShanPalia APK Hub</a>
<nav>
<a href="#">Home</a>
<a href="#latestapps">Latest Apps</a>
<a href="admin.html" class="admin-btn">👑 Admin Panel</a>
</nav>
</header>

<section class="hero">
<h1>ShanPalia APK Hub</h1>
<p>Download Android Apps, AI Tools, Social Apps & Utilities</p>
<div class="search-box">
<input type="text" id="searchInput" placeholder="Search APKs..." onkeyup="searchApps()">
<button onclick="searchApps()">Search</button>
</div>
</section>

<section class="section" id="latestapps">
<h2 class="title">Latest Uploaded Apps</h2>
<div id="apps-container" class="apps">
    <p style="grid-column: 1/-1; text-align: center; color: #64748b;">Loading amazing apps...</p>
</div>
</section>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ralinnuegsbuvlhwpzln.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJhbGlubnVlZ3NidXZsaHdwemxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyOTU2NDIsImV4cCI6MjA5NTg3MTY0Mn0.hIec6UxRx5gzSMTi5oJ3_xXw3d1QKCmKsPF-stBwIFE";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadApps(){
    try {
        let { data: apps, error } = await supabaseClient
            .from('apps')
            .select('*')
            .order('id', { ascending: false });

        if (error) throw error;

        const container = document.getElementById("apps-container");
        container.innerHTML = ""; 

        apps.forEach(app => {
            container.innerHTML += `
                <a href="${app.apk}" target="_blank" class="app-card">
                    <img src="${app.icon || 'https://cdn-icons-png.flaticon.com/512/5124/5124017.png'}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/5124/5124017.png'">
                    <h3>${app.name}</h3>
                    <span class="view-btn">Download Now</span>
                </a>
            `;
        });
    } catch (error) {
        console.error(error);
    }
}
loadApps();
</script>
</body>
</html>
