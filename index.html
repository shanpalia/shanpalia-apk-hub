        apps.forEach(app => {
            container.innerHTML += `
                <div class="app-card">
                    <img src="${app.icon || 'https://cdn-icons-png.flaticon.com/512/5124/5124017.png'}" alt="App">

                    <a href="${app.download_link}" class="view-btn">Download Now</a>
                </div>
            `;
        });
    }
    loadApps();
</script>
