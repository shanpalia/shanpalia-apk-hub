<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta property="og:title" content="ShanPalia APK Hub" />
    <meta property="og:description" content="Download the latest Android Apps, AI Tools, and Utilities safely and quickly." />
    <meta property="og:image" content="https://cdn-icons-png.flaticon.com/512/5124/5124017.png" />
    <meta property="og:url" content="https://shanpalia.github.io/shanpalia-apk-hub/" />
    <meta property="og:type" content="website" />

    <style>
        * { margin:0; padding:0; box-sizing:border-box; font-family: sans-serif; }
        body { background: #f9fafb; color: #111827; }
        header { background: #fff; padding: 20px 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .logo { font-size: 24px; font-weight: bold; color: #2563eb; text-decoration: none; }
        .admin-btn { background: #dc2626; color: white; padding: 8px 16px; border-radius: 20px; text-decoration: none; font-size: 14px; font-weight: bold; }
        .hero { padding: 60px 20px; text-align: center; }
        .apps-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; padding: 20px 5%; }
        .app-card { background: #fff; padding: 20px; border-radius: 15px; text-align: center; border: 1px solid #e5e7eb; transition: 0.3s; }
        .app-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        .app-card img { width: 80px; height: 80px; border-radius: 15px; margin-bottom: 10px; object-fit: cover; }
        .view-btn { display: inline-block; background: #2563eb; color: #fff; padding: 10px 20px; border-radius: 10px; text-decoration: none; margin-top: 10px; font-weight: bold; }
    </style>
</head>
<body>

<header>
    <a href="index.html" class="logo">ShanPalia APK Hub</a>
    <a href="admin.html" class="admin-btn">👑 Admin</a>
</header>

<section class="hero">
    <h1>Latest Android Apps</h1>
</section>

<div id="apps-container" class="apps-grid">
    <p style="grid-column: 1/-1; text-align: center;">Loading apps...</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    // 1. Apni URL aur Key yahan daalein
    const SUPABASE_URL = "https://ralinunegsbuvlhwpzln.supabase.co"; // Apna Project URL
    const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJhbGlubnVlZ3NidXZsaHdwemxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyOTU2NDIsImV4cCI6MjA5NTg3MTY0Mn0.hIec6UxRx5gzSMTi5oJ3_xXw3d1QKCmKsPF-stBwIFE"; // Apni Nayi Key Yahan Paste Karein
    
    const supabase = supabasejs.createClient(SUPABASE_URL, SUPABASE_KEY);

    async function loadApps() {
        const container = document.getElementById('apps-container');
        
        // Supabase se data fetch karein
        const { data: apps, error } = await supabase.from('apps').select('*');

        if (error) {
            container.innerHTML = `<p style="color:red;">Error: ${error.message}</p>`;
            return;
        }

        if (!apps || apps.length === 0) {
            container.innerHTML = `<p>Koi apps nahi mile.</p>`;
            return;
        }

        container.innerHTML = '';
        apps.forEach(app => {
            container.innerHTML += `
                <div class="app-card">
                    <img src="${app.icon || 'https://cdn-icons-png.flaticon.com/512/5124/5124017.png'}" alt="App Icon">
                    <h3>${app.name}</h3>
                    <a href="app.html?id=${app.id}" class="view-btn">View Details</a>
                </div>
            `;
        });
    }

    loadApps();
</script>

</body>
</html>
