<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>App Details - ShanPalia APK Hub</title>
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
body{ background:#f8fafc; color:#111827; padding-bottom: 50px; }
header{ background:#ffffff; padding:18px 5%; display:flex; justify-content:space-between; align-items:center; box-shadow:0 2px 12px rgba(0,0,0,.06); position:sticky; top:0; z-index:999; }
.logo{ font-size:30px; font-weight:700; color:#2563eb; text-decoration:none; }
.container { max-width: 800px; margin: 40px auto; background: white; padding: 40px; border-radius: 20px; box-shadow: 0 4px 15px rgba(0,0,0,.05); border: 1px solid #e5e7eb; }
.app-header { display: flex; gap: 25px; align-items: center; margin-bottom: 30px; }
.app-header img { width: 120px; height: 120px; border-radius: 24px; object-fit: cover; border: 1px solid #e5e7eb; }
.app-info h1 { font-size: 32px; margin-bottom: 8px; color: #1e293b; }
.stats-grid { display: flex; gap: 20px; margin-top: 10px; font-size: 14px; color: #64748b; }
.stat-box { background: #f1f5f9; padding: 6px 12px; border-radius: 8px; font-weight: bold; color: #2563eb; }
.download-section { margin: 30px 0; padding: 20px; background: #eff6ff; border-radius: 15px; text-align: center; }
.btn-download { display: inline-block; background: #2563eb; color: white; text-decoration: none; padding: 16px 40px; font-size: 18px; border-radius: 12px; font-weight: bold; box-shadow: 0 4px 15px rgba(37,99,235,0.3); transition: 0.2s; cursor: pointer;}
.btn-download:hover { background: #1d4ed8; transform: translateY(-2px); }
.description-section { margin-top: 30px; line-height: 1.6; color: #334155; }
.description-section h2 { margin-bottom: 15px; color: #1e293b; }
.comment-section { margin-top: 40px; border-top: 1px solid #e5e7eb; padding-top: 30px; }
.comment-section h2 { margin-bottom: 20px; }
.comment-form input, .comment-form textarea { width: 100%; padding: 12px; margin-bottom: 10px; border: 1px solid #cbd5e1; border-radius: 8px; outline: none; }
.comment-form button { background: #2563eb; color: white; border: none; padding: 12px 24px; border-radius: 8px; cursor: pointer; font-weight: bold; }
.comments-list { margin-top: 20px; }
.comment-card { background: #f8fafc; padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #e5e7eb; }
.comment-card h4 { color: #1e293b; margin-bottom: 5px; }
.comment-card p { color: #475569; font-size: 14px; }
</style>
</head>
<body>

<header>
    <a href="index.html" class="logo">ShanPalia APK Hub</a>
</header>

<div class="container" id="app-details-container">
    <p style="text-align:center; color:#64748b;">Loading App Details...</p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ralinnuegsbuvlhwpzln.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJhbGlubnVlZ3NidXZsaHdwemxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyOTU2NDIsImV4cCI6MjA5NTg3MTY0Mn0.hIec6UxRx5gzSMTi5oJ3_xXw3d1QKCmKsPF-stBwIFE";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const urlParams = new URLSearchParams(window.location.search);
const appId = urlParams.get('id');

let currentAppDownloads = 0;

async function loadAppDetails() {
    if(!appId) {
        document.getElementById("app-details-container").innerHTML = "<p style='color:red; text-align:center;'>App not found!</p>";
        return;
    }

    try {
        let { data: app, error } = await supabaseClient
            .from('apps')
            .select('*')
            .eq('id', appId)
            .single();

        if (error) throw error;

        let currentIcon = app.icon || "https://cdn-icons-png.flaticon.com/512/5124/5124017.png";
        if(currentIcon.includes("link-to-your")) currentIcon = "https://cdn-icons-png.flaticon.com/512/5124/5124017.png";

        currentAppDownloads = app.downloads || 0;
        let ratingValue = app.rating || "4.5";

        const container = document.getElementById("app-details-container");
        container.innerHTML = `
            <div class="app-header">
                <img src="${currentIcon}" alt="${app.name}" onerror="this.src='https://cdn-icons-png.flaticon.com/512/5124/5124017.png'">
                <div class="app-info">
                    <h1>${app.name}</h1>
                    <div class="stats-grid">
                        <span class="stat-box" id="download-counter">📥 ${currentAppDownloads} Downloads</span>
                        <span class="stat-box">⭐ ${ratingValue} Rating</span>
                    </div>
                </div>
            </div>

            <div class="download-section">
                <a href="${app.apk || '#'}" class="btn-download" onclick="registerDownload(${app.id})" target="_blank">Download APK File</a>
            </div>

            <div class="description-section">
                <h2>Description</h2>
                <p style="white-space: pre-wrap;">${app.description || 'No description available for this app.'}</p>
            </div>

            <div class="comment-section">
                <h2>User Reviews & Comments</h2>
                <div class="comment-form">
                    <input type="text" id="comName" placeholder="Your Name">
                    <textarea id="comText" rows="3" placeholder="Write a comment..."></textarea>
                    <button onclick="postComment()">Submit Review</button>
                </div>
                <div class="comments-list" id="comments-list-box"></div>
            </div>
        `;

        renderComments();

    } catch (error) {
        console.error(error);
        document.getElementById("app-details-container").innerHTML = "<p style='color:red; text-align:center;'>Failed to load app data.</p>";
    }
}

// Fixed Real-time Download counter increment handler
async function registerDownload(id) {
    // Screen par instant +1 dikhane ke liye
    currentAppDownloads += 1;
    const counterEl = document.getElementById("download-counter");
    if(counterEl) {
        counterEl.innerText = `📥 ${currentAppDownloads} Downloads`;
    }

    try {
        // Supabase database column update query
        await supabaseClient
            .from('apps')
            .update({ downloads: currentAppDownloads })
            .eq('id', id);
    } catch(e) {
        console.error("Error updating download count:", e);
    }
}

function postComment() {
    let name = document.getElementById("comName").value.trim() || "Anonymous";
    let text = document.getElementById("comText").value.trim();
    if(!text) return;

    let storageKey = "comments_app_" + appId;
    let currentComments = JSON.parse(localStorage.getItem(storageKey)) || null;
    
    // Agar local storage khali hai toh default comments ko merge karke save karenge
    if (!currentComments) {
        currentComments = [
            {name: "Rahul Kumar", text: "Very useful app, downloaded successfully!"},
            {name: "ShanPalia User", text: "Nice UI, fast downloading link."}
        ];
    }
    
    currentComments.push({ name: name, text: text });
    localStorage.setItem(storageKey, JSON.stringify(currentComments));
    
    document.getElementById("comText").value = "";
    document.getElementById("comName").value = "";
    renderComments();
}

function renderComments() {
    let storageKey = "comments_app_" + appId;
    let currentComments = JSON.parse(localStorage.getItem(storageKey));
    
    if (!currentComments) {
        currentComments = [
            {name: "Rahul Kumar", text: "Very useful app, downloaded successfully!"},
            {name: "ShanPalia User", text: "Nice UI, fast downloading link."}
        ];
    }
    
    let box = document.getElementById("comments-list-box");
    box.innerHTML = "";
    
    // Copy banakar reverse karenge taaki naya comment sabse upar dikhe
    let displayList = [...currentComments].reverse();
    
    displayList.forEach(c => {
        box.innerHTML += `
            <div class="comment-card">
                <h4>👤 ${c.name}</h4>
                <p>${c.text}</p>
            </div>
        `;
    });
}

loadAppDetails();
</script>
</body>
</html>
