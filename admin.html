<!DOCTYPE html>
<html>
<head>
    <title>Manual App Manager</title>
    <style>
        body { font-family: sans-serif; padding: 20px; }
        .card { max-width: 500px; margin: auto; padding: 20px; border: 1px solid #ccc; }
        input, textarea { width: 100%; margin: 10px 0; padding: 8px; }
    </style>
</head>
<body>
    <div class="card">
        <h3>App Details</h3>
        <input type="text" id="name" placeholder="App Name">
        <input type="text" id="icon" placeholder="Icon URL">
        <input type="text" id="apk" placeholder="MediaFire Link">
        <textarea id="desc" placeholder="Description"></textarea>
        <button onclick="generateCode()">Generate Code</button>
        <hr>
        <textarea id="output" rows="6" placeholder="Copy this code..."></textarea>
    </div>

    <script>
        function generateCode() {
            const name = document.getElementById('name').value;
            const icon = document.getElementById('icon').value;
            const apk = document.getElementById('apk').value;
            const desc = document.getElementById('desc').value;

            const code = `<div class="app-card">
    <img src="${icon}" width="50">
    <h3>${name}</h3>
    <p>${desc}</p>
    <a href="${apk}">Download APK</a>
</div>`;
            document.getElementById('output').value = code;
        }
    </script>
</body>
</html>
