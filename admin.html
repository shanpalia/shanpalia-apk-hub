<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ShanPalia Admin Panel</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; max-width: 500px; margin: auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .btn { padding: 10px; cursor: pointer; border: none; border-radius: 5px; color: white; width: 100%; background: #2563eb; margin-top: 10px; }
        .hidden { display: none; }
    </style>
</head>
<body>

<!-- Login Section -->
<div id="login-box" class="card">
    <h2>Admin Login</h2>
    <input type="password" id="pass" placeholder="Enter Password">
    <button class="btn" onclick="check()">Login</button>
</div>

<!-- Upload Section -->
<div id="admin-panel" class="card hidden">
    <h3>Add New App</h3>
    <input type="text" id="appName" placeholder="App Name">
    <textarea id="appDesc" placeholder="Description"></textarea>
    <input type="text" id="appIcon" placeholder="Icon URL">
    <input type="text" id="appApk" placeholder="MediaFire Link">
    <button class="btn" onclick="saveApp()">Publish App</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const supabase = window.supabase.createClient("https://ralinnuegsbuvlhwpzln.supabase.co", "sb_publishable_pXsTbFOseqm5uuA0hzqSzQ_UJxdvQi9");

    // Login Function
    function check() {
        if(document.getElementById("pass").value === "kss@1#HAFSA") {
            document.getElementById("login-box").style.display = "none";
            document.getElementById("admin-panel").classList.remove("hidden");
        } else {
            alert("Wrong Password!");
        }
    }

    // Save Function
    async function saveApp() {
        const { error } = await supabase.from('apps').insert([{
            name: document.getElementById('appName').value,
            description: document.getElementById('appDesc').value,
            icon: document.getElementById('appIcon').value,
            apk: document.getElementById('appApk').value
        }]);

        if(error) { alert("Error: " + error.message); } 
        else { alert("App Published Successfully!"); }
    }
</script>
</body>
</html>
