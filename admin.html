<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ShanPalia Admin Panel</title>
<style>
*{ margin:0; padding:0; box-sizing:border-box; font-family:Arial,sans-serif; }
body{ background:#f1f5f9; color:#111827; display:flex; justify-content:center; align-items:center; min-height:100vh; padding:20px; }
.admin-card { background:white; width:100%; max-width:600px; padding:35px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.05); border:1px solid #e2e8f0; }
h1 { color:#2563eb; margin-bottom:25px; font-size:28px; text-align:center; font-weight:800; }
.form-group { margin-bottom:18px; }
label { display:block; margin-bottom:8px; font-weight:bold; color:#475569; font-size:14px; }
input, textarea, select { width:100%; padding:14px; border:1px solid #cbd5e1; border-radius:10px; font-size:15px; outline:none; background:#f8fafc; }
input:focus, textarea:focus, select:focus { border-color:#2563eb; background:white; }
.btn-submit { background:#2563eb; color:white; border:none; width:100%; padding:15px; border-radius:10px; font-size:16px; font-weight:bold; cursor:pointer; margin-top:10px; transition:0.2s; }
.btn-submit:hover { background:#1d4ed8; }
#login-box { text-align:center; }
.hidden { display:none; }
#status-msg { text-align:center; margin-top:15px; font-weight:bold; }
.success { color:#10b981; }
.error { color:#ef4444; }
.nav-back { display:inline-block; margin-top:15px; color:#2563eb; text-decoration:none; font-weight:bold; font-size:14px; }
</style>
</head>
<body>

<div id="login-box" class="admin-card">
    <h1>ShanPalia Lock 🔒</h1>
    <div class="form-group">
        <label>Enter Admin Secret Key</label>
        <input type="password" id="secretKeyInput" placeholder="Yahan apna password daalein...">
    </div>
    <button class="btn-submit" onclick="verifyAdmin()">Verify Admin</button>
    <a href="index.html" class="nav-back">⬅ Back to Website</a>
    <p id="login-error" class="error" style="margin-top:15px;"></p>
</div>

<div id="upload-panel" class="admin-card hidden">
    <h1>Upload New APK 🚀</h1>
    
    <div class="form-group">
        <label>App Name</label>
        <input type="text" id="appName" placeholder="e.g., Social Finder">
    </div>

    <div class="form-group">
        <label>Category</label>
        <select id="appCategory">
            <option value="Social">📱 Social Apps</option>
            <option value="AI">🤖 AI Apps</option>
            <option value="Tools">🛠 Tools</option>
            <option value="Games">🎮 Games</option>
            <option value="Utilities">⚡ Utilities</option>
        </select>
    </div>

    <div class="form-group">
        <label>Flaticon Icon URL</label>
        <input type="text" id="appIcon" placeholder="Paste flaticon cdn link here...">
    </div>

    <div class="form-group">
        <label>MediaFire APK Download URL</label>
        <input type="text" id="appApk" placeholder="Paste MediaFire file link here...">
    </div>

    <div class="form-group">
        <label>Initial Rating (Optional)</label>
        <input type="text" id="appRating" value="4.5" placeholder="e.g., 4.8">
    </div>

    <div class="form-group">
        <label>App Description</label>
        <textarea id="appDescription" rows="4" placeholder="Write details about the app..."></textarea>
    </div>

    <button class="btn-submit" id="submitBtn" onclick="uploadApp()">Publish App Live</button>
    <p id="status-msg"></p>
    <center><a href="index.html" class="nav-back">View Main Website</a></center>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://ralinnuegsbuvlhwpzln.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJhbGlubnVlZ3NidXZsaHdwemxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyOTU2NDIsImV4cCI6MjA5NTg3MTY0Mn0.hIec6UxRx5gzSMTi5oJ3_xXw3d1QKCmKsPF-stBwIFE";
const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// 🔑 AAPKA SECRET PASSWORD (Ise aap badal bhi sakte hain)
const SHANPALIA_SECRET_KEY = "shanpalia786";

// Login check system
function verifyAdmin() {
    const enteredKey = document.getElementById("secretKeyInput").value;
    const errorEl = document.getElementById("login-error");

    if(enteredKey === SHANPALIA_SECRET_KEY) {
        document.getElementById("login-box").classList.add("hidden");
        document.getElementById("upload-panel").classList.remove("hidden");
    } else {
        errorEl.innerText = "❌ Invalid Key! Aap admin nahi hain.";
    }
}

// Database me upload karne ka code
async function uploadApp() {
    const name = document.getElementById("appName").value.trim();
    const category = document.getElementById("appCategory").value;
    const icon = document.getElementById("appIcon").value.trim();
    const apk = document.getElementById("appApk").value.trim();
    const rating = document.getElementById("appRating").value.trim() || "4.5";
    const description = document.getElementById("appDescription").value.trim();
    
    const msgEl = document.getElementById("status-msg");
    const btn = document.getElementById("submitBtn");

    if(!name || !icon || !apk || !description) {
        msgEl.className = "error";
        msgEl.innerText = "⚠ Please fill all required fields!";
        return;
    }

    try {
        btn.disabled = true;
        btn.innerText = "Uploading to Database...";
        msgEl.innerText = "";

        // Insert command with ratings and downloads default setup
        const { data, error } = await supabaseClient
            .from('apps')
            .insert([
                { 
                    name: name, 
                    category: category, 
                    icon: icon, 
                    apk: apk, 
                    rating: rating, 
                    downloads: 0, 
                    description: description 
                }
            ]);

        if (error) throw error;

        msgEl.className = "success";
        msgEl.innerText = "🎉 App uploaded successfully! Main website par live ho gayi.";
        
        // Form clear logic
        document.getElementById("appName").value = "";
        document.getElementById("appIcon").value = "";
        document.getElementById("appApk").value = "";
        document.getElementById("appDescription").value = "";
        
    } catch (error) {
        console.error(error);
        msgEl.className = "error";
        msgEl.innerText = "❌ Upload failed: " + error.message;
    } finally {
        btn.disabled = false;
        btn.innerText = "Publish App Live";
    }
}
</script>
</body>
</html>
