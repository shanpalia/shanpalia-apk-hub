<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ShanPalia Admin Panel</title>
    <style>
        body { font-family: sans-serif; background: #f4f7f6; padding: 20px; }
        .card { background: white; padding: 20px; border-radius: 10px; max-width: 600px; margin: auto; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        input, textarea { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 5px; box-sizing: border-box; }
        .btn { padding: 10px 15px; cursor: pointer; border: none; border-radius: 5px; color: white; width: 100%; margin-top: 10px; }
        .add-btn { background: #2563eb; }
        .del-btn { background: #dc2626; margin-top: 5px; }
        .hidden { display: none; }
        .tab-nav { display: flex; gap: 10px; margin-bottom: 20px; }
    </style>
</head>
<body>

<!-- Login Section -->
<div id="login-box" class="card">
    <h2>Admin Login</h2>
    <input type="password" id="pass" placeholder="Password">
    <button class="btn add-btn" onclick="check()">Login</button>
</div>

<!-- Main Dashboard -->
<div id="admin-panel" class="card hidden">
    <div class="tab-nav">
        <button onclick="showTab('add')">Add App</button>
        <button onclick="showTab('manage')">Manage Apps</button>
    </div>

    <!-- Add App Tab -->
    <div id="tab-add">
        <h3>Upload New App</h3>
        <input type="text" id="appName" placeholder="App Name">
        <button onclick="generateAI()">✨ AI Generate Description</button>
        <textarea id="appDesc" rows="3" placeholder="Description"></textarea>
        <input type="text" id="appIcon" placeholder="Icon URL">
        <input type="text" id="appApk" placeholder="APK Link">
        <input type="file" id="appScreenshots" multiple>
        <button class="btn add-btn" onclick="saveApp()">Publish App</button>
    </div>

    <!-- Manage App Tab -->
    <div id="tab-manage" class="hidden">
        <h3>Manage Apps</h3>
        <div id="apps-list">Loading...</div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
    const supabase = supabase.createClient("YOUR_SUPABASE_URL", "YOUR_SUPABASE_KEY");

    function check() {
        if(document.getElementById("pass").value === "kss@1#HAFSA") {
            document.getElementById("login-box").style.display = "none";
            document.getElementById("admin-panel").classList.remove("hidden");
        } else { alert("Wrong Password!"); }
    }

    function showTab(t) {
        document.getElementById('tab-add').classList.toggle('hidden', t !== 'add');
        document.getElementById('tab-manage').classList.toggle('hidden', t !== 'manage');
        if(t === 'manage') loadApps();
    }

    async function loadApps() {
        const { data } = await supabase.from('apps').select('*');
        document.getElementById('apps-list').innerHTML = data.map(app => `
            <div style="border-bottom:1px solid #ccc; padding:10px;">
                <strong>${app.name}</strong>
                <button class="btn del-btn" onclick="deleteApp('${app.id}')">Delete</button>
            </div>
        `).join('');
    }

    async function deleteApp(id) {
        await supabase.from('apps').delete().eq('id', id);
        loadApps();
    }

    async function saveApp() {
        const { error } = await supabase.from('apps').insert([{
            name: document.getElementById('appName').value,
            description: document.getElementById('appDesc').value,
            icon: document.getElementById('appIcon').value,
            apk: document.getElementById('appApk').value
        }]);
        if(!error) alert("App Uploaded!");
    }

    async function generateAI() {
        const name = document.getElementById('appName').value;
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=YOUR_GEMINI_KEY`, {
            method: 'POST',
            body: JSON.stringify({ contents: [{ parts: [{ text: "Write short description for " + name }] }] })
        });
        const data = await res.json();
        document.getElementById('appDesc').value = data.candidates[0].content.parts[0].text;
    }
</script>
</body>
</html>
