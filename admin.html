<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ShanPalia Pro Admin</title>
    <style>
        body{ background:#f1f5f9; font-family:Arial; padding:20px; display:flex; justify-content:center; }
        .admin-card { background:white; width:100%; max-width:600px; padding:30px; border-radius:20px; box-shadow:0 10px 25px rgba(0,0,0,0.1); }
        .form-group { margin-bottom:15px; }
        input, textarea { width:100%; padding:12px; border:1px solid #cbd5e1; border-radius:8px; margin-top:5px; }
        .btn { background:#2563eb; color:white; border:none; width:100%; padding:15px; border-radius:8px; cursor:pointer; font-weight:bold; }
        .hidden { display:none; }
        #status-msg { margin-top:10px; font-weight:bold; }
    </style>
</head>
<body>

<div id="login-box" class="admin-card">
    <h1>Login 🔒</h1>
    <input type="password" id="secretKeyInput" placeholder="Enter Password...">
    <button class="btn" onclick="verifyAdmin()">Verify Admin</button>
</div>

<div id="upload-panel" class="admin-card hidden">
    <h1>Upload App 🚀</h1>
    <div class="form-group">
        <label>App Name</label>
        <input type="text" id="appName">
    </div>
    <div class="form-group">
        <label>Description</label>
        <button type="button" onclick="generateAI()" style="background:#8b5cf6; color:white; border:none; padding:8px; border-radius:5px; cursor:pointer;">✨ AI Generate</button>
        <textarea id="appDescription" rows="4"></textarea>
    </div>
    <div class="form-group">
        <label>Screenshots (Select multiple)</label>
        <input type="file" id="screenshots" multiple accept="image/*">
    </div>
    <input type="text" id="appIcon" placeholder="Icon URL">
    <input type="text" id="appApk" placeholder="MediaFire Link">
    
    <button class="btn" id="submitBtn" onclick="uploadApp()">Publish Live</button>
    <p id="status-msg"></p>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
// CONFIGURATION - YAHAN APNI KEYS DAALEIN
const SUPABASE_URL = "https://sb_publishable_pXsTbFOseqm5uuA0hzqSzQ_UJxdvQi9";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJhbGlubnVlZ3NidXZsaHdwemxuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODAyOTU2NDIsImV4cCI6MjA5NTg3MTY0Mn0.hIec6UxRx5gzSMTi5oJ3_xXw3d1QKCmKsPF-stBwIFE"; 
const GEMINI_API_KEY = "AQ.Ab8RN6Lqh-jHWT70mhCrWH8EIatdwjr0ZMtwHwQUnZxzp2cpuA"; 

const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

function verifyAdmin() {
    const enteredKey = document.getElementById("secretKeyInput").value.trim();
    const correctKey = "kss@1#HAFSA";

    console.log("Entered:", enteredKey); // यह देखने के लिए कि आप क्या डाल रहे हैं
    console.log("Correct:", correctKey);

    if(enteredKey === correctKey) {
        document.getElementById("login-box").classList.add("hidden");
        document.getElementById("upload-panel").classList.remove("hidden");
        console.log("Login Success!");
    } else {
        alert("❌ Invalid Key!Invalid Password .");
    }
}

async function generateAI() {
    const name = document.getElementById("appName").value;
    if(!name) return alert("Pehle App Name likhein");
    const descField = document.getElementById("appDescription");
    descField.value = "Generating...";
    
    try {
        const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${GEMINI_API_KEY}`, {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ contents: [{ parts: [{ text: "Write a short, engaging description for an Android app called " + name }] }] })
        });
        const data = await response.json();
        descField.value = data.candidates[0].content.parts[0].text;
    } catch(e) {
        descField.value = "Error: API Key check karein";
    }
}

async function uploadApp() {
    const btn = document.getElementById("submitBtn");
    const msg = document.getElementById("status-msg");
    const files = document.getElementById("screenshots").files;
    let screenshotUrls = [];

    btn.disabled = true;
    msg.innerText = "Uploading screenshots...";

    for(let file of files) {
        const path = Date.now() + "_" + file.name;
        const { data } = await supabase.storage.from('screenshots').upload(path, file);
        if(data) {
            const res = supabase.storage.from('screenshots').getPublicUrl(path);
            screenshotUrls.push(res.data.publicUrl);
        }
    }

    const { error } = await supabase.from('apps').insert([{
        name: document.getElementById("appName").value,
        description: document.getElementById("appDescription").value,
        icon: document.getElementById("appIcon").value,
        apk: document.getElementById("appApk").value,
        screenshots: screenshotUrls.join(",")
    }]);

    if(error) { msg.innerText = "Error: " + error.message; msg.style.color = "red"; }
    else { msg.innerText = "🎉 Success! App live ho gayi."; msg.style.color = "green"; }
    btn.disabled = false;
}
</script>
</body>
</html>
