<!DOCTYPE html>
<html lang="en">
<head>

    <title>Admin Panel</title>

        .admin-card { background: white; padding: 25px; border-radius: 15px; width: 300px; margin: 50px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        .hidden { display: none; }
        input { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; cursor: pointer; }
    </style>
</head>
<body>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>

    const SUPABASE_URL = "https://ralinnuegsbuvlhwpzln.supabase.co";
    const SUPABASE_KEY = "sb_publishable_pXsTbFOseqm5uuA0hzqSzQ_UJxdvQi9"; 
    
    // सिर्फ एक बार इनिशियलाइज़ करें
    const supabase = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    function verifyAdmin() {

</script>
</body>
</html>
