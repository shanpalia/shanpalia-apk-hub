<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Admin Panel</title>
    <style>
        .admin-card { background: white; padding: 25px; border-radius: 15px; width: 300px; margin: 50px auto; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        /* क्लास को .hidden के बजाय सीधा 'display: none' रखेंगे */
    </style>
</head>
<body>

<div id="login-box" class="admin-card">
    <h2>Admin Login</h2>
    <input type="password" id="pass" placeholder="Password">
    <button onclick="check()">Login</button>
</div>

<!-- यहाँ style="display:none" पक्का लगायें -->
<div id="upload-panel" class="admin-card" style="display:none;">
    <h2>Upload Panel</h2>
    <p>Success! You are logged in.</p>
</div>

<script>
    function check() {
        var p = document.getElementById("pass").value;
        if(p === "kss@1#HAFSA") {
            // लॉगिन बॉक्स को गायब करें
            document.getElementById("login-box").style.display = "none";
            // अपलोड पैनल को दिखाएं
            document.getElementById("upload-panel").style.display = "block";
            console.log("Panel should be visible now");
        } else {
            alert("Galat Password!");
        }
    }
</script>
</body>
</html>
