<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>ShanPalia Admin</title>
    <style>
        .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); width: 350px; margin: 20px auto; }
        .hidden { display: none; }
        input, textarea { width: 100%; padding: 8px; margin: 5px 0; box-sizing: border-box; }
        button { width: 100%; padding: 10px; cursor: pointer; background: #2563eb; color: white; border: none; border-radius: 5px; }
    </style>
</head>
<body>

<!-- Login Box -->
<div id="login-box" class="card">
    <input type="password" id="pass" placeholder="Password">
    <button onclick="check()">Login</button>
</div>

<!-- Upload Panel (लॉगिन के बाद यही दिखेगा) -->
<div id="upload-panel" class="card hidden">
    <h2>Upload App</h2>
    <input type="text" id="appName" placeholder="App Name">
    <textarea id="appDescription" placeholder="Description"></textarea>
    <input type="text" id="appIcon" placeholder="Icon URL">
    <input type="text" id="appApk" placeholder="APK Link">
    <button onclick="uploadApp()">Publish</button>
    <p id="status-msg"></p>
</div>

<script>
    function check() {
        if(document.getElementById("pass").value === "kss@1#HAFSA") {
            document.getElementById("login-box").style.display = "none";
            document.getElementById("upload-panel").style.display = "block";
        } else {
            alert("Wrong Password!");
        }
    }

    function uploadApp() {
        document.getElementById("status-msg").innerText = "Uploading...";
        // यहाँ अपना Supabase वाला लॉजिक दोबारा डाल सकते हैं
        alert("Upload logic yahan trigger hoga!");
    }
</script>
</body>
</html>
